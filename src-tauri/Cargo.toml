[package]
name = "goosereader"
version = "0.1.0"
description = "Reader for goosereader Markdown zip archives"
authors = ["goosereader"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "goosereader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
epubmd-core = { path = "../crates/epubmd-core" }
base64 = "0.22"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
zip = "2"
